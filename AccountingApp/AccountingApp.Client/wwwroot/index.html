<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AccountingApp</title>
  <base href="/" />
  <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="AccountingApp.Client.styles.css" rel="stylesheet" />
  <link href="_content/Sotsera.Blazor.Toaster/toastr.min.css" rel="stylesheet" />
  <style>
    #app.pre-auth .loading-progress,
    #app.pre-auth .loading-progress-text {
      visibility: hidden !important;
    }

    /* ログアウト確認ダイアログ（index.html の常駐スクリプトが生成） */
    #logout-confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #logout-confirm-overlay .lc-box {
      background: #fff;
      border-radius: 8px;
      padding: 24px 28px;
      min-width: 320px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    #logout-confirm-overlay .lc-msg {
      font-size: 1.05rem;
      margin-bottom: 18px;
    }
    #logout-confirm-overlay .lc-btns {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    #logout-confirm-overlay button {
      padding: 6px 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f8f9fa;
      cursor: pointer;
    }
    #logout-confirm-overlay button.lc-primary {
      background: #dc3545;
      border-color: #dc3545;
      color: #fff;
    }
  </style>

  <script>
    window.jsFunctions = {
      getCookie: function () {
        return document.cookie || "";
      }
    };

    // Logout の誤クリック防止: data-system="logout" のクリックに確認ダイアログを挟む
    // （capture フェーズで Blazor より先に受け、確認 OK 時のみ元のクリックを再送する）
    document.addEventListener('click', function (e) {
      const a = e.target.closest('[data-system="logout"]');
      if (!a || a.dataset.logoutConfirmed === '1') return;
      e.preventDefault();
      e.stopPropagation();
      if (document.getElementById('logout-confirm-overlay')) return;
      const ov = document.createElement('div');
      ov.id = 'logout-confirm-overlay';
      ov.innerHTML =
        '<div class="lc-box"><div class="lc-msg">ログアウトしますか？</div>' +
        '<div class="lc-btns">' +
        '<button type="button" class="lc-cancel">キャンセル</button>' +
        '<button type="button" class="lc-primary">ログアウト</button>' +
        '</div></div>';
      document.body.appendChild(ov);
      const close = () => ov.remove();
      ov.addEventListener('click', (ev) => { if (ev.target === ov) close(); });
      ov.querySelector('.lc-cancel').addEventListener('click', close);
      ov.querySelector('.lc-primary').addEventListener('click', () => {
        close();
        a.dataset.logoutConfirmed = '1';
        a.click();
        delete a.dataset.logoutConfirmed;
      });
    }, true);
  </script>
</head>

<body>
  <div id="app" class="pre-auth">
    <svg class="loading-progress">
      <circle r="40%" cx="50%" cy="50%" />
      <circle r="40%" cx="50%" cy="50%" />
    </svg>
    <div class="loading-progress-text"></div>
  </div>

  <div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="" class="reload">Reload</a>
    <a class="dismiss">🗙</a>
  </div>
  <script src="_framework/blazor.webassembly.js" autostart="false"></script>
  <script>
    async function isAuthenticated() {
      try {
        const res = await fetch("api/account/current_user", { credentials: "include", cache: "no-store" });
        if (!res.ok) return false;
        const data = await res.json();
        const id = (data?.value ?? data?.Value ?? "").trim();
        return id.length > 0;
      } catch { return false; }
    }

    function sanitizeReturnUrl(u) {
      try {
        if (!u) return "/";
        if (!u.startsWith("/")) return "/";
        if (u.startsWith("//")) return "/";
        return u;
      } catch { return "/"; }
    }

    (async function boot() {
      if (await isAuthenticated()) {
        const app = document.getElementById('app');
        app?.classList.remove('pre-auth');
        await Blazor.start();
        window.__blazorStarted = true;
        return;
      }

      const safe = sanitizeReturnUrl(location.pathname + location.search + location.hash);
      if (safe === "/" || safe === "") {
        location.replace("/login.html");
      } else {
        location.replace(`/login.html?returnUrl=${encodeURIComponent(safe)}`);
      }
    })();
  </script>
</body>
</html>
